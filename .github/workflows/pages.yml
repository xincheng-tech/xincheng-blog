name: Deploy to GitHub Pages

on:
  push:
    branches:
      - codex/xingchen-galaxy-3d

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run build -- --base "$PAGES_BASE"
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path || '/' }}
      - uses: actions/upload-pages-artifact@v4
        id: upload
        with:
          path: dist
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          if [[ -z "$PAGES_ARTIFACT_ID" ]]; then
            echo "The Pages upload did not return an artifact ID."
            exit 1
          fi
          for attempt in {1..12}; do
            if ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id') &&
              grep -qx "$PAGES_ARTIFACT_ID" <<< "$ids"; then
              exit 0
            fi
            sleep 5
          done
          echo "GitHub did not list the newly uploaded Pages artifact."
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
