name: Deploy to GitHub Pages

on:
  push:
    branches:
      - codex/xingchen-galaxy-3d

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run build -- --base "$PAGES_BASE"
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path || '/' }}
      - uses: actions/upload-pages-artifact@v5.0.0
        id: upload
        with:
          path: dist
      - name: Deploy the uploaded Pages artifact
        uses: actions/github-script@v9
        id: deployment
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            // The upload returns the exact artifact ID. Use it directly so deployment
            // does not depend on the Actions artifact search service.
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId < 1) {
              throw new Error("Pages upload did not provide a valid artifact ID");
            }
            const oidcToken = await core.getIDToken();
            core.setSecret(oidcToken);
            const { data: deployment } = await github.request(
              "POST /repos/{owner}/{repo}/pages/deployments",
              {
                ...context.repo,
                artifact_id: artifactId,
                pages_build_version: context.sha,
                oidc_token: oidcToken,
              },
            );
            const deploymentId = deployment.id ?? context.sha;
            const failures = new Set([
              "deployment_failed", "deployment_content_failed",
              "deployment_cancelled", "deployment_lost",
            ]);
            for (let attempt = 0; attempt < 48; attempt++) {
              await new Promise((resolve) => setTimeout(resolve, 5000));
              const { data } = await github.request(
                "GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}",
                { ...context.repo, pages_deployment_id: deploymentId },
              );
              if (data.status === "succeed") {
                core.setOutput("page_url", deployment.page_url);
                core.info(`Published ${deployment.page_url}`);
                return;
              }
              if (failures.has(data.status)) throw new Error(`Pages deployment: ${data.status}`);
            }
            throw new Error(`Timed out waiting for Pages deployment ${deploymentId}`);
